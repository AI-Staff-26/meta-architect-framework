# Prompt catalog: one key per prompt id. Schema: agent/SCHEMA.md (v1.2)
summary.write:
  title: Сводка документа
  step: summary.write
  model: summarizer
  version: v0
  lang: ru
  stage: 1 · Сводка — шаг s1
  purpose: |-
    Модель читает извлечённый текст документа и пишет сводку для человека, у которого нет времени читать целиком: вывод одной строкой, главные пункты, риски со ссылкой на пункт документа.

    Длину и язык выбирает человек при заказе. Страницы-сканы без текста код помечает при загрузке — модель о них знает и не додумывает их содержание.
  system: |-
    Ты делаешь сводку деловых документов для человека, у которого нет времени читать их целиком.

    Правила:
    - Только то, что написано в документе. Чего в тексте нет — того нет и в сводке.
    - Цифры, сроки и суммы — как в документе, с единицами.
    - "tldr" — одна фраза: что это за документ и главное условие.
    - "points" — коротко: 5–7 пунктов; подробно: по одному пункту на раздел документа.
    - "risks" — условия, невыгодные для читателя: штрафы без предела, односторонние изменения, короткие сроки уведомления. У каждого — номер пункта документа.
    - Пропущенные страницы не пересказывай и не угадывай.
    - Ответ — только JSON по схеме.
  user: |-
    Документ: {{title}} ({{pages}} стр.)
    Длина сводки: {{length}}
    Язык сводки: {{language}}
    {{#textless_pages}}Страницы {{textless_pages}} — сканы без текста, их нет в тексте ниже.{{/textless_pages}}

    Текст документа:
    {{text}}
  output: |-
    {
      "tldr": "",
      "points": [""],
      "risks": [{"clause": "", "why": ""}]
    }
  vars:
    - [title, document.title]
    - [pages, document.pages]
    - [length, "summary_options.length: short — 5–7 пунктов, full — по разделам"]
    - [language, summary_options.language]
    - [textless_pages, "document.textless_pages — секция пропадает, если сканов нет"]
    - [text, "текст из document.text_asset_id, извлечённый при загрузке (u1)"]
  example:
    note: "На демо-документе: договор аренды склада, 14 страниц, страницы 13–14 — сканы подписей; коротко, по-русски."
    input: |-
      Документ: Договор аренды склада (14 стр.)
      Длина сводки: short
      Язык сводки: ru
      Страницы 13, 14 — сканы без текста, их нет в тексте ниже.

      Текст документа:
      ДОГОВОР АРЕНДЫ НЕЖИЛОГО ПОМЕЩЕНИЯ № 14/2026
      1. Предмет договора. Арендодатель передаёт, а Арендатор принимает во временное пользование складское помещение площадью 1 200 м²…
    output: |-
      {
        "tldr": "Аренда склада 1 200 м² на 3 года с 1 ноября; ставка растёт на 5 % в год.",
        "points": [
          "Арендная плата — 540 000 ₽ в месяц, до 5-го числа.",
          "Обеспечительный платёж — две месячные ставки.",
          "Ремонт кровли и инженерных сетей — за арендодателем.",
          "Досрочный выход — с уведомлением за 6 месяцев.",
          "Страхование товара — за арендатором."
        ],
        "risks": [
          {"clause": "п. 7.3", "why": "штраф 0,5 % в день за просрочку платежа без верхнего предела"},
          {"clause": "п. 9.1", "why": "арендодатель может поднять ставку сверх 5 % при росте налога на имущество"}
        ]
      }
  notes: |-
    - Температура низкая (0,2): сводка пересказывает, а не сочиняет.
    - Длинный документ не режется на части: до `max_pages` он целиком помещается в контекст модели. Если лимит поднимут — понадобится сводка по частям и второй проход.
  source: Новый промпт v0 — написан под этот путь; рабочего прототипа нет.
