# Journey «Сводка документа». Schema: agent/SCHEMA.md (v1.2)
journey:
  id: summary
  tab: 1 · Сводка
  title: Сводка документа
  lead: |-
    Человек загружает документ, заказывает сводку и скачивает её. Сводку пишет внешняя модель — фоновой задачей с коллбэком.

    Кредиты **замораживаются** при заказе и **списываются**, только когда сводка видна. Сбой или дедлайн возвращает их сразу; сводка, пришедшая после дедлайна, ставится бесплатно.
  check:
    - Цена на кнопке «Сделать сводку» и что происходит с кредитами при сбое
    - Что видит человек, если сводка пишется дольше 10 минут
    - Что внутри скачанного файла
  steps:
    - id: u1
      title: Загрузить документ
      cells:
        user: Перетаскивает PDF или DOCX → **«Загрузить»**.
        screen: "Карточка документа: название, число страниц, **«Сделать сводку · 3 кредита»**."
        engine: Файл — в хранилище; текст извлекает код в том же запросе. Скан без текста — отказ с объяснением.
        models: Код, без модели.
        data: "`document` status=uploaded"
      models: [code]
      refs: [DOC-1]
      detail:
        user: Человек видит карточку документа сразу после загрузки — сводку можно заказать с неё же.
        mock: |-
          # Новый документ
          {Перетащите PDF или DOCX — до 20 МБ}
          [Загрузить]
          > Скан без текстового слоя не подойдёт — нужен текст
        hood: |-
          Один синхронный запрос:
          - файл — в хранилище;
          - текст — извлекает код, страницы-сканы без текста помечаются в `textless_pages`;
          - название — из формы, иначе имя файла.
        data: "`document`: файл, текст, число страниц; `user_action` kind=document_upload."
    - id: s1
      title: Заказать сводку
      cells:
        user: Выбирает длину — коротко или подробно → **«Сделать сводку · 3 кредита»**.
        screen: "Кнопка превращается в строку хода: «Читаем документ…»."
        engine: Холд 3 кредитов и заказ — одной транзакцией, ответ 202. Затем воркер создаёт задачу у провайдера.
        models: "LLM-сводчик: задача с `callback_url`, промпт `summary.write`."
        data: "`ledger_entry` hold · `document` status=summarizing, job_id"
      models: [summarizer]
      prompts: [summary.write]
      div: [d-summary-length]
      refs: [SUM-1, BILL-2]
      detail:
        mock: |-
          # Договор аренды склада · 14 страниц
          ◉ Коротко — 5–7 пунктов
          ○ Подробно — по разделам
          [Сделать сводку · 3 кредита]
          > Кредиты спишутся, только когда сводка будет готова
        hood: |-
          1. Запрос коммитит переход документа и холд одной транзакцией и сразу отвечает 202.
          2. Воркер собирает запрос по `summary.write`, пишет его в журнал вызовов и создаёт задачу с `callback_url`. Провайдер не ответил или отказал — кредиты возвращаются в транзакции сбоя.

          Повторный заказ возможен и у документа со сводкой: прежняя остаётся на карточке, пока пишется новая.
        calls: [c.summary.create]
        divergence: "Бриф: одна кнопка, сводка на страницу. ТЗ: два режима. Предлагаю оставить два — см. «Расхождения»."
    - id: s2
      title: Сводка пишется
      cells:
        user: Ждёт — или закрывает вкладку.
        screen: «Пишем сводку…» → сводка на карточке.
        engine: "Итог — коллбэком; опрос раз в 20 с — страховка. Дедлайн 10 минут — затем кредиты возвращаются."
        models: "LLM-сводчик: итог задачи."
        data: "`document.summary` · списание или возврат холда"
      models: [summarizer]
      refs: [SUM-2, SUM-3]
      detail:
        hood: |-
          1. Итог приходит коллбэком; опрос раз в 20 с ловит потерянный коллбэк.
          2. Успех — сводка и списание холда одной транзакцией. Сбой — возврат холда в транзакции сбоя.
          3. Через 10 минут без итога документ возвращается туда, откуда начинал, и кредиты возвращаются. Задача у провайдера не отменяется: если сводка всё-таки придёт, она ставится бесплатно.
        calls: [c.summary.result]
        states: |-
          - Сбой провайдера — «Сводка не получилась. Кредиты вернулись — Повторить».
          - Дедлайн — «Сводка пишется дольше обычного — кредиты вернулись».
          - Страницы-сканы — сводка готова, строкой ниже сказано, какие страницы пропущены.
    - id: d1
      title: Скачать сводку
      cells:
        user: "**«Скачать сводку»** → Markdown или DOCX."
        screen: Файл скачивается сразу.
        engine: Файл собирает код из `document.summary` в момент запроса.
        models: Код, без модели.
        data: "`user_action` kind=summary_download"
      models: [code]
      refs: [SUM-4]
      detail:
        mock: |-
          # Сводка · Договор аренды склада
          [Скачать сводку] [(DOCX)]
        hood: "Внутри: название документа, дата сводки, вывод одной строкой, пункты, риски со ссылками на пункты договора."
  seq:
    title: "Последовательность: сводка"
    actors:
      - id: w
        label: Веб
        color: var(--lane-screen)
      - id: e
        label: Двигатель
        color: var(--lane-engine)
      - id: l
        label: LLM-сводчик
        color: var(--lane-models)
      - id: db
        label: База и журнал
        color: var(--lane-data)
    msgs:
      - from: w
        to: e
        text: POST /documents + файл
      - from: e
        to: db
        text: document = uploaded, текст в хранилище
      - from: w
        to: e
        text: POST /documents/{id}/summary + Idempotency-Key
      - from: e
        to: db
        text: холд + document = summarizing — одна транзакция
      - from: e
        to: w
        text: 202 + поток
        dashed: true
      - from: e
        to: db
        text: llm_call — до отправки
      - from: e
        to: l
        text: "createJob: summary.write, callback_url"
      - from: l
        to: e
        text: job_id
        dashed: true
      - from: l
        to: e
        text: "коллбэк: status = succeeded"
      - from: e
        to: db
        text: сводка + списание холда — одна транзакция
      - from: e
        to: w
        text: "поток: done"
        dashed: true
      - from: w
        to: e
        text: GET /documents/{id}/summary/file
      - from: e
        to: w
        text: файл сводки
        dashed: true
