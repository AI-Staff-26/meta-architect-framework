# Free-form tabs. Schema: agent/SCHEMA.md (v1.2)
notes:
  - id: credits
    tab: Кредиты
    title: Как кредиты проходят через сводку
    lead: Сводка — платная операция, которая ждёт внешнего провайдера. Кредиты не списываются, пока человек не увидел результат, и возвращаются в той же транзакции, что и сбой.
    cards:
      - title: Холд
        body: |-
          - Ставится вместе с переходом в «пишется сводку» — одной транзакцией (D02 + H01).
          - Баланс проверяется под блокировкой счёта: два заказа подряд не уводят его в минус.
          - Один холд — один заказ; «Повторить» — новый заказ и новый холд.
      - title: Списание
        body: Только когда сводка на карточке — в транзакции перехода в «сводка готова» (D04 + H02).
      - title: Возврат
        body: |-
          - Сбой провайдера, нечитаемый ответ или отказ — возврат в транзакции сбоя (H03).
          - Дедлайн 10 минут — тоже возврат. Человеку сказано, что кредиты вернулись.
      - title: Поздний итог
        body: Задача у провайдера не отменяется. Если сводка пришла после дедлайна, она ставится **бесплатно** — кредиты уже вернулись, второй раз их не берём (D06).
    seq:
      title: "Последовательность: кредиты"
      actors:
        - id: e
          label: Двигатель
          color: var(--lane-engine)
        - id: db
          label: Реестр кредитов
          color: var(--lane-data)
      msgs:
        - from: e
          to: db
          text: "заказ: запись hold, ref = заказ"
        - from: e
          to: db
          text: "сводка видна: запись capture"
        - from: e
          to: db
          text: "сбой или дедлайн: запись release"
          dashed: true
