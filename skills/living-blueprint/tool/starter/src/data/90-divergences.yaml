divergences:
  - id: d-summary-length
    area: Длина сводки
    status: discuss
    owner: "Бриф: «одна кнопка — сводка на страницу»."
    tz: "ТЗ: два режима — **коротко** (5–7 пунктов) и **подробно** (по разделам документа)."
    proposal: |-
      Оставить два режима при одной цене:
      - договору на 40 страниц пяти пунктов мало — человек закажет сводку второй раз и заплатит дважды;
      - переключатель стоит над кнопкой, по умолчанию — «коротко», так что для большинства это всё та же одна кнопка.

      Если владелец против — убираем переключатель, длина — short.
