# Blueprint meta, lanes and model registry. Schema: agent/SCHEMA.md (v1.2)
meta:
  title: "Документ → сводка → скачивание: как это работает"
  status: черновик для сверки — не утверждено
  version: v0
  date: "14.10.2026"
  actors:
    - member
    - system
  rules:
    - "Ошибки API — единый формат `{code, message_ru, action}`. В контрактах: HTTP-статус → `code — «message_ru»`."
    - "Доступ: каждый эндпоинт проверяет владельца документа (`owner_user_id`). Чужой или несуществующий документ — 404, не 403. Без входа — 401 `login_required` «Войдите, чтобы продолжить»."
    - "Идемпотентность: `Idempotency-Key` обязателен у POST, которые создают сущность или стоят кредитов, — без него 400 `idempotency_key_required` «Обновите страницу и повторите». Тот же ключ и то же тело — тот же ответ (200) в течение `idempotency_ttl`; другое тело — 422 `idempotency_body_mismatch` «Запрос изменился — обновите страницу». «Повторить» после сбоя — новое действие с новым ключом."
    - "Выключенный флаг: эндпоинт отвечает 503 `feature_disabled` с текстом из `meta.flags.<флаг>.off`; кнопка неактивна с тем же пояснением. Контракты не повторяют ни это, ни 401, ни 400 и 422 идемпотентности."
    - "Переход состояния — compare-and-set по `from`: `UPDATE … WHERE status IN (from)`. Второе срабатывание (коллбэк и опрос одновременно, двойной клик) — no-op с записью в журнал. Запрос, чей переход не прошёл, отвечает 409 `state_conflict` «Обновите страницу — состояние изменилось», если у эндпоинта нет своего кода."
    - "Переходы, связанные `with`, коммитятся одной транзакцией: холд ставится вместе с заказом, списание — вместе с готовой сводкой, `compensation` — вместе со сбоем. Реестр кредитов — только добавление записей `ledger_entry`."
    - "Прогресс — SSE `GET /api/v1/stream/document:{id}`: события `{seq, type: stage|error|done, payload}`, возобновление по `Last-Event-ID`. Чужой документ — 404."
    - "Каждый вызов провайдера пишется в журнал вызовов (`llm_call`) до отправки, отдельной короткой транзакцией; ключ — только псевдонимом. Причина сбоя — в журнал и в поле `error` документа."
  params:
    max_upload_mb:
      value: 20 МБ
      source: spec
      note: PDF и DOCX с текстовым слоем
    max_pages:
      value: 300 страниц
      source: provider
      note: больше — провайдер отклоняет задачу, поэтому проверяем при заказе
    price.summary:
      value: 3 кредита
      source: admin
      note: меняется в админке без деплоя; цена на кнопке берётся отсюда
    idempotency_ttl:
      value: 24 ч
      source: spec
    poll_interval:
      value: 20 с
      source: spec
      note: опрос — страховка на случай потерянного коллбэка
    summary_deadline:
      value: 10 мин
      source: spec
      note: от входа в summarizing; p95 провайдера — 3 мин по его документации, проверить на живом прогоне
  flags:
    documents.upload:
      'off': «Загрузить документ» неактивна; загруженные документы и сводки доступны.
    summaries.order:
      'off': «Сделать сводку» и «Повторить» неактивны; начатые сводки доходят до конца — кредиты списываются или возвращаются как обычно.
      note: Выключатель на случай сбоя провайдера.
  external_events:
    - AccountDeleted
  as_is:
    title: Как сейчас — по коду приложения
    body: |-
      Сводок сейчас нет: документ открывают и читают целиком.

      1. **Загрузка уже есть** — `POST /api/v1/documents` кладёт файл в хранилище, но текст не извлекает. Извлечение добавляется в тот же запрос.
      2. **Кредиты уже есть** — реестр `ledger_entry` с холдом, списанием и возвратом. Сводка — первая платная операция, которая ждёт внешнего провайдера.
      3. **Коллбэков от провайдеров нет** — обработчик `/api/v1/callbacks/summary/{token}` новый.
  labels:
    div_tab: Расхождения
    div_title: "Расхождения: бриф владельца ↔ ТЗ"
    div_owner: Бриф владельца
    div_spec: ТЗ сейчас
    div_proposal: Предложение архитектора
    example_of: на демо-документе
  promptsLead: |-
    Промпты пути — версия v0. Что уходит в **system**, что — в **user**, какие поля подставляет код. Пример заполнен на демо-документе — **договоре аренды склада** на 14 страниц.

    Ответ в примере — **иллюстрация**, а не результат модели.
  modelsLead: Какая модель стоит на каком шаге и с какими параметрами. Модель меняет админ в реестре без деплоя.
  divLead: Бриф владельца против ТЗ. Ниже — где они расходятся и что предлагаю. В ТЗ это ещё не внесено.
lanes:
  - id: user
    title: Пользователь
    hint: что делает человек
    color: var(--lane-user)
  - id: screen
    title: Экран
    hint: что он видит
    color: var(--lane-screen)
  - id: engine
    title: Двигатель
    hint: процесс, шаги, сохранение
    color: var(--lane-engine)
  - id: models
    title: Модели
    hint: какие вызовы уходят наружу
    color: var(--lane-models)
  - id: data
    title: Данные
    hint: что записывается в базу
    color: var(--lane-data)
models:
  - key: summarizer
    name: LLM-сводчик (пакетный API провайдера)
    provider: llm
    used_for: Сводка документа (`summary.write`)
    where: "Внешний провайдер: `POST /v1/jobs` с `callback_url`, итог — коллбэком или опросом `GET /v1/jobs/{id}`. Ключ — псевдоним `llm/docsum` в хранилище секретов"
    params: temperature 0,2 · max_output_tokens 4000 · ответ по JSON-схеме summary
    cost: ≈ $0,01 за документ в 20 страниц
    note: "Задачи у провайдера не отменяются: итог, пришедший после дедлайна, ставится бесплатно (D06)"
    external: true
    slow: true
  - key: code
    name: Код (без модели)
    provider: code
    used_for: Извлечение текста при загрузке, сборка запроса к провайдеру, файл сводки
    where: воркер приложения
    params: "—"
    cost: "0"
    note: "Всё, что можно сделать без модели, делает код: быстрее, дешевле, предсказуемо"
